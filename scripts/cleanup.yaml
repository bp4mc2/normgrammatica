title: Cleanup BWB turtle
version: 1.0
prefixes:
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  sh: http://www.w3.org/ns/shacl#
  owl: http://www.w3.org/2002/07/owl#
  xsd: http://www.w3.org/2001/XMLSchema#
queries:
  - title: copy all from input to output
    query: >
      insert { graph <urn:output> {?s?p?o} }
      where { graph <urn:input> {?s?p?o} }
  - title: copy eli:title_short to correct place
    query: >
      prefix eli: <http://data.europa.eu/eli/ontology#>
      insert {
        graph <urn:output> {
          ?e eli:title_short ?ts
        }
      }
      where {
        graph <urn:output> {
          ?e eli:realizes ?w.
          ?w eli:title_short ?ts
        }
      }
  - title: flush eli:title_short
    query: >
      prefix eli: <http://data.europa.eu/eli/ontology#>
      delete {
        graph <urn:output> {
          ?w eli:title_short ?ts.
        }
      }
      where {
        graph <urn:input> {
          ?w eli:title_short ?ts.
        }
      }
